[package]
name = "eg2cpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CPU (SIMD, SME, AMX) inference for the EmbeddingGemma 2 encoder, text, images and audio, with compiled decision handles"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/undrgrnd-labs/hunch"
publish = false
keywords = ["embeddings", "simd", "inference", "gemma"]
categories = ["science"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
anyhow = "1.0.104"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde_json = "1.0.154"
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# `jpeg` for CMYK JPEGs, which `vision::decode_jpeg` (on `jpeg-decoder`) leaves to `image`.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false, features = ["rayon"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
